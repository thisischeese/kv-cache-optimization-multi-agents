[project]
name = "kv-cache-optimization-multi-agents"
version = "0.1.0"
description = "LangGraph multi-agent evaluation of KV cache optimization techniques"
readme = "README.md"
authors = [
    { name = "thisischeese", email = "iamclwm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "reportlab>=5.0.1",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kv_eval"

[tool.pytest.ini_options]
testpaths = ["tests"]
