[project]
name = "kv-cache-optimization-multi-agents"
version = "0.1.0"
description = "LangGraph multi-agent evaluation of KV cache optimization techniques"
readme = "README.md"
authors = [
    { name = "thisischeese", email = "iamclwm@gmail.com" }
]
requires-python = ">=3.11"
# TODO[2-승은] 체크포인터 의존성 "langgraph-checkpoint-sqlite"를 추가한다(uv add langgraph-checkpoint-sqlite).
dependencies = [
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "perplexityai>=0.43.5",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "reportlab>=5.0.1",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kv_eval"

[tool.pytest.ini_options]
testpaths = ["tests"]
# app.py를 import하는 테스트가 있어서 프로젝트 루트를 경로에 넣는다(uv run pytest로도 실행되게).
pythonpath = ["."]
